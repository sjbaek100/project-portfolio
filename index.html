<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Technology Risk & Controls Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>

:root{
  --bg:#f8f7f5;
  --paper:#ffffff;
  --paper-soft:#fbfaf8;
  --ink:#1a2332;
  --ink-2:#344054;
  --muted:#6b7280;
  --muted-2:#95989a;
  --line:#dedbd6;
  --line-2:#c9c5bf;
  --accent:#3b5998;
  --accent-2:#2f477c;
  --accent-soft:#eff1f7;
  --red:#c93b47;
  --red-bg:#fef2f2;
  --amber:#c77a28;
  --amber-bg:#fefaf3;
  --green:#188a6d;
  --green-bg:#f0faf7;
  --blue:#3b5998;
  --blue-bg:#f3f5fa;
  --shadow:0 10px 26px rgba(26,35,50,.045);
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,.action-link:focus-visible{
  outline:2px solid rgba(59,89,152,.35);
  outline-offset:2px;
}
.container{width:min(1180px,calc(100% - 48px));margin:0 auto}

/* ---------- Global header ---------- */
header{
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:40;
}
header>.container{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:28px;
}
.brand-block{display:flex;align-items:center;gap:12px;min-width:240px}
.brand-mark{
  width:34px;height:34px;border:1px solid var(--line-2);border-radius:6px;
  display:grid;place-items:center;background:var(--paper);color:var(--accent);
  font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:14px;
}
.brand-copy h1{
  font-family:'Source Serif 4',Georgia,serif;
  font-size:18px;line-height:1.1;letter-spacing:-.02em;font-weight:600;color:var(--ink)
}
.brand-copy p{font-size:10.5px;color:var(--muted);margin-top:3px}
nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
nav button{
  border:1px solid transparent;background:transparent;color:var(--muted);
  padding:8px 11px;border-radius:5px;font-size:12px;font-weight:600
}
nav button:hover{background:var(--paper-soft);color:var(--ink)}
nav button.active{background:var(--accent-soft);border-color:#d9deea;color:var(--accent)}
.portfolio-note{
  background:#fff;border-bottom:1px solid var(--line);color:var(--muted);
  font-size:10.8px;padding:7px 0
}
.portfolio-note strong{color:var(--ink-2)}

/* ---------- Typography ---------- */
.section{padding:30px 0 84px}
.section-title,
.hero-title,
.case-document h2,
.case-document h3,
.about-intro h2{
  font-family:'Source Serif 4',Georgia,serif;
}
.section-title{
  font-size:32px;line-height:1.18;letter-spacing:-.025em;font-weight:500;color:var(--ink);margin:0
}
.eyebrow{
  display:block;color:var(--muted-2);font-size:9.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;margin-bottom:9px
}
.page-intro{color:var(--muted);font-size:13.5px;max-width:760px;margin-top:10px;line-height:1.75}
.muted{color:var(--muted)!important}
.grid{display:grid;gap:16px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.buttons{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}
button.primary,button.secondary{
  min-height:39px;padding:9px 14px;border-radius:5px;font-size:12px;font-weight:650
}
button.primary{background:var(--accent);color:#fff;border:1px solid var(--accent)}
button.primary:hover:not(:disabled){background:var(--accent-2)}
button.secondary{background:#fff;color:var(--ink-2);border:1px solid var(--line-2)}
button.secondary:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
button:disabled{opacity:.42;cursor:not-allowed}

/* ---------- Home ---------- */
.home-shell{
  display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.72fr);
  gap:48px;align-items:start
}
.home-main{padding:40px 0 8px}
.hero-title{
  font-size:clamp(44px,5vw,64px);line-height:1.06;letter-spacing:-.045em;
  font-weight:500;max-width:820px;color:var(--ink)
}
.hero-sub{
  font-size:15.5px;line-height:1.8;color:var(--muted);max-width:740px;margin-top:20px
}
.credential-line{
  margin-top:22px;font-size:11.5px;color:var(--ink-2);display:inline-flex;gap:7px;align-items:center
}
.credential-line:before{content:"✓";color:var(--green);font-weight:800}
.home-actions{margin-top:26px}
.home-aside{
  background:var(--paper);border:1px solid var(--line);padding:23px 24px;
  box-shadow:none;border-radius:7px
}
.home-aside h3{
  font-family:'Source Serif 4',Georgia,serif;font-size:17px;font-weight:500;color:var(--ink);margin-bottom:14px
}
.snapshot-list{display:grid}
.snapshot-row{
  display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)
}
.snapshot-row:last-child{border-bottom:0}
.snapshot-row span:first-child{font-size:11.5px;color:var(--muted)}
.snapshot-row strong{font-size:13px;color:var(--ink);font-weight:700}
.home-divider{height:1px;background:var(--line);margin:30px 0 30px}
.overview-context{
  display:grid;
  grid-template-columns:1fr 1.35fr 1fr;
  border:1px solid var(--line);
  border-radius:6px;
  background:#fff;
  overflow:hidden;
  margin-bottom:18px;
}
.context-item{
  padding:15px 17px;
}
.context-item+.context-item{
  border-left:1px solid var(--line);
}
.context-label{
  display:block;
  margin-bottom:5px;
  font-size:8.8px;
  font-weight:700;
  letter-spacing:.08em;
  color:var(--accent);
  text-transform:uppercase;
}
.context-item strong{
  display:block;
  margin-bottom:4px;
  color:var(--ink);
  font-family:'Source Serif 4',Georgia,serif;
  font-size:14px;
  font-weight:500;
}
.context-item p{
  color:var(--muted);
  font-size:10.6px;
  line-height:1.48;
}
.home-capabilities{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)
}
.capability{padding:23px 24px 23px 0}
.capability+.capability{padding-left:24px;border-left:1px solid var(--line)}
.capability .step-tag{
  font-size:9px;font-weight:700;color:var(--accent);letter-spacing:.09em;margin-bottom:8px
}
.capability h4{
  font-family:'Source Serif 4',Georgia,serif;font-size:17px;font-weight:500;color:var(--ink);margin-bottom:6px
}
.capability p{font-size:12.2px;color:var(--muted);line-height:1.65}
.flow-summary{
  margin-top:24px;display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--muted);font-size:10.5px
}
.flow-summary .node{color:var(--ink-2);font-weight:600}
.flow-summary .arrow{color:#b7b3ad}


/* ---------- Home refinement ---------- */
.home-main{
  max-width:860px;
  padding:38px 0 18px;
}
.how-it-works{
  margin-top:34px;
  padding:26px 0 4px;
  border-top:1px solid var(--line);
}
.how-header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:18px;
  margin-bottom:16px;
}
.how-header .eyebrow{margin-bottom:0}
.how-header h3{
  font-family:'Source Serif 4',Georgia,serif;
  font-size:22px;
  line-height:1.2;
  font-weight:500;
  color:var(--ink);
}
.how-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  border:1px solid var(--line);
  background:#fff;
  border-radius:6px;
  overflow:hidden;
}
.how-step{
  min-height:140px;
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding:18px 16px;
  border-left:1px solid var(--line);
}
.how-step:first-child{border-left:0}
.how-number{
  flex:0 0 auto;
  font-size:9px;
  color:var(--accent);
  font-weight:700;
  letter-spacing:.07em;
  margin-top:2px;
}
.how-step strong{
  display:block;
  color:var(--ink);
  font-size:12px;
  font-weight:650;
  margin-bottom:5px;
}
.how-step p{
  color:var(--muted);
  font-size:10.7px;
  line-height:1.55;
}

/* remove former project snapshot layout constraints */
.home-shell{
  display:block;
}
.home-aside{
  display:none;
}


/* ---------- Home: How It Works replaces Project Snapshot ---------- */
.home-shell{
  display:grid;
  grid-template-columns:minmax(0,1.45fr) minmax(315px,.72fr);
  gap:48px;
  align-items:start;
}
.home-aside{
  display:block;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:7px;
  padding:23px 24px;
  box-shadow:none;
}
.how-aside .eyebrow{
  margin-bottom:7px;
}
.how-aside h3{
  font-family:'Source Serif 4',Georgia,serif;
  font-size:20px;
  line-height:1.2;
  font-weight:500;
  color:var(--ink);
  margin-bottom:13px;
}
.how-aside-list{
  display:grid;
}
.how-aside-step{
  display:grid;
  grid-template-columns:28px minmax(0,1fr);
  gap:9px;
  padding:12px 0;
  border-top:1px solid var(--line);
}
.how-aside-step:first-child{
  border-top:0;
  padding-top:4px;
}
.how-aside-number{
  color:var(--accent);
  font-size:9px;
  line-height:1.5;
  font-weight:700;
  letter-spacing:.06em;
}
.how-aside-step strong{
  display:block;
  color:var(--ink);
  font-size:11.5px;
  line-height:1.35;
  font-weight:650;
  margin-bottom:3px;
}
.how-aside-step p{
  color:var(--muted);
  font-size:10.3px;
  line-height:1.5;
}

/* old full-width How It Works section no longer used */
.how-it-works{
  display:none;
}

/* ---------- Workbench ---------- */
.workbench-header{
  display:flex;justify-content:space-between;gap:28px;align-items:flex-start;margin-bottom:25px
}
.workbench-header-copy{max-width:690px}
.workbench-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.workbench-shell{
  display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:18px;align-items:start
}
.panel{
  background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:22px
}
.panel-title{
  display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:14px
}
.step-number{
  width:23px;height:23px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:9.5px;font-weight:700;flex:0 0 auto
}
.panel-copy{font-size:12.2px;color:var(--muted);line-height:1.65;margin-bottom:15px}
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.upload{
  background:#fdfcfb;border:1.5px dashed var(--line-2);border-radius:6px;padding:17px;min-height:126px
}
.upload:hover{border-color:var(--accent);background:var(--accent-soft)}
.upload label{display:block;font-size:11.5px;font-weight:650;color:var(--ink-2);margin-bottom:9px}
.upload input{
  width:100%;background:#fff;border:1px solid var(--line);border-radius:5px;padding:7px;color:var(--muted);font-size:10.8px
}
.upload input::file-selector-button{
  border:0;border-radius:4px;background:var(--accent-soft);color:var(--accent);
  font-weight:650;padding:7px 9px;margin-right:8px
}
.upload p{font-size:10.2px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.criteria-stack{display:grid;gap:10px}
.criteria-input{border-bottom:1px solid var(--line);padding-bottom:12px}
.criteria-input:last-child{border-bottom:0;padding-bottom:0}
.criteria-input label{display:block;font-size:10.4px;color:var(--muted);font-weight:650;margin-bottom:6px}
.criteria-input input{
  width:100%;height:37px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);
  padding:8px 10px;font-size:12px;font-weight:600
}
.criteria-input p{font-size:9.6px;color:var(--muted-2);line-height:1.45;margin-top:5px}
.run-bar{
  margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:14px;align-items:center
}
.run-note{font-size:10.3px;color:var(--muted)}
.schema-toggle{margin-top:14px}
details.schema-details{border-top:1px solid var(--line);padding-top:12px}
details.schema-details summary{cursor:pointer;font-size:10.8px;font-weight:650;color:var(--ink-2)}
.schema{
  font-size:10.3px;line-height:1.7;background:#faf9f7;border:1px solid var(--line);
  border-radius:5px;padding:11px;margin-top:10px;color:var(--muted)
}
.error,.info{border-radius:5px;padding:11px 12px;margin-top:14px;font-size:11.3px}
.info{scroll-margin-top:96px}
.error{background:var(--red-bg);border:1px solid #f3c9cc;color:var(--red)}
.info{background:var(--blue-bg);border:1px solid #d8deea;color:var(--ink-2)}


/* ---------- Executive Summary ---------- */
.executive-summary{
  margin-top:18px;
}
.summary-kicker{
  font-size:9.5px;color:var(--muted-2);font-weight:700;text-transform:uppercase;
  letter-spacing:.09em;margin-bottom:10px
}
.assessment-hero{
  display:grid;
  grid-template-columns:minmax(0,1.55fr) minmax(360px,.9fr);
  border:1px solid #efc7cb;
  border-left:5px solid var(--red);
  border-radius:6px;
  overflow:hidden;
  background:linear-gradient(135deg,#fff 0%,#fff8f7 100%);
  box-shadow:0 8px 22px rgba(180,35,24,.055);
}
.assessment-hero-copy{
  padding:24px 26px;
}
.assessment-hero-label{
  font-size:9.5px;
  color:var(--red);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.095em;
  margin-bottom:8px;
}
.assessment-hero-status{
  font-family:'Source Serif 4',Georgia,serif;
  font-size:30px;
  line-height:1.1;
  font-weight:600;
  color:var(--ink);
  margin-bottom:9px;
}
.assessment-hero-detail{
  max-width:700px;
  font-size:12.3px;
  line-height:1.65;
  color:var(--ink-2);
}
.assessment-hero-stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  border-left:1px solid #efd8da;
  background:rgba(255,255,255,.68);
}
.assessment-hero-stat{
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:20px 17px;
  border-left:1px solid var(--line);
}
.assessment-hero-stat:first-child{border-left:0}
.assessment-hero-stat strong{
  display:block;
  font-size:32px;
  line-height:1;
  color:var(--ink);
  font-weight:750;
  margin-bottom:8px;
}
.assessment-hero-stat span{
  font-size:9.6px;
  line-height:1.4;
  color:var(--muted);
  font-weight:650;
  text-transform:uppercase;
  letter-spacing:.045em;
}
.metric-summary-grid{
  grid-template-columns:repeat(3,minmax(0,1fr));
  margin-top:12px;
}
.executive-card{
  background:#fff;border:1px solid var(--line);border-left:4px solid transparent;
  border-radius:5px;padding:16px 18px;min-height:118px
}
.executive-card.high-accent{border-left-color:var(--red)}
.executive-card.medium-accent{border-left-color:var(--amber)}
.executive-label{
  font-size:9.2px;color:var(--muted-2);font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:8px
}
.executive-value{
  font-size:30px;line-height:1;font-weight:700;color:var(--ink);margin-bottom:8px
}
.executive-detail{font-size:10.4px;color:var(--muted);line-height:1.5}


/* ---------- Compact executive metric grid ---------- */
.metric-summary-grid{
  grid-template-columns:repeat(3,minmax(0,1fr));
  margin-top:10px;
  gap:8px;
}
.metric-summary-grid .executive-card{
  min-height:74px;
  padding:11px 13px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  grid-template-areas:
    "label value"
    "detail value";
  column-gap:12px;
  align-items:center;
}
.metric-summary-grid .executive-label{
  grid-area:label;
  margin-bottom:2px;
  font-size:8.7px;
}
.metric-summary-grid .executive-value{
  grid-area:value;
  margin:0;
  font-size:25px;
  align-self:center;
}
.metric-summary-grid .executive-detail{
  grid-area:detail;
  font-size:9.6px;
  line-height:1.4;
  max-width:210px;
}

/* ---------- Results ---------- */
.results-shell{margin-top:28px}
.result-overview{
  display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(120px,.45fr));gap:0;
  background:var(--paper);border:1px solid var(--line);border-radius:7px;overflow:hidden
}
.result-main{
  padding:22px;border-left:4px solid var(--red);
  background:linear-gradient(135deg,#fff 0%,var(--red-bg) 100%)
}
.result-main .label{
  font-size:9.2px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px
}
.result-main h3{
  font-family:'Source Serif 4',Georgia,serif;font-size:21px;font-weight:500;color:var(--ink);margin-bottom:7px
}
.result-main p{font-size:12.2px;color:var(--muted);line-height:1.65}
.result-stat{padding:21px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.result-stat span{font-size:9.2px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.result-stat strong{font-size:25px;color:var(--ink);line-height:1;margin-top:8px}
.result-toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:24px 0 12px}
.result-toolbar h3{
  font-family:'Source Serif 4',Georgia,serif;font-size:19px;font-weight:500;color:var(--ink)
}
.result-toolbar p{font-size:10.8px;color:var(--muted)}
.results-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
.result-side{display:grid;gap:14px}

/* exception cards: borrowed from the reference design, fitted to v22 logic */
.exception-list{display:grid;gap:10px}
.exception-item{
  background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--red);
  border-radius:5px;padding:15px 16px
}
.exception-item.medium{border-left-color:var(--amber)}
.exception-header{
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px
}
.exception-title{font-size:12.5px;font-weight:650;color:var(--ink)}
.exception-meta{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px;
  padding:9px 0;margin-bottom:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)
}
.exception-meta span{font-size:9.2px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em}
.exception-meta strong{display:block;margin-top:2px;font-size:10.8px;color:var(--ink-2);font-weight:650;text-transform:none;letter-spacing:0}
.exception-detail{font-size:11.3px;color:var(--muted);line-height:1.6}
.exception-trace{margin-top:9px}
.exception-empty{
  background:var(--green-bg);border:1px solid #cbe9df;border-left:4px solid var(--green);
  border-radius:5px;padding:16px;font-size:11.5px;color:var(--green)
}

/* supporting metric list */
.metric-list{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.metric{
  border:0;border-bottom:1px solid var(--line);background:#fff;padding:12px 13px;

<body>
  <div id="root"></div>

  <script type="text/babel">
    const normalizeHeader = (h) =>
      String(h || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");

    const parseCSV = (text) => {
      const rows = [];
      let row = [], field = "", inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (ch === '"' && inQuotes && next === '"') {
          field += '"'; i++;
        } else if (ch === '"') {
          inQuotes = !inQuotes;
        } else if (ch === "," && !inQuotes) {
          row.push(field); field = "";
        } else if ((ch === "\n" || ch === "\r") && !inQuotes) {
          if (ch === "\r" && next === "\n") i++;
          row.push(field);
          if (row.some(v => String(v).trim() !== "")) rows.push(row);
          row = []; field = "";
        } else {
          field += ch;
        }
      }
      if (inQuotes) {
        throw new Error("Malformed CSV: an opened quoted field was not closed.");
      }

      row.push(field);
      if (row.some(v => String(v).trim() !== "")) rows.push(row);
      if (!rows.length) return [];

      const headers = rows[0].map(normalizeHeader);
      return rows.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, idx) => obj[h] = String(r[idx] ?? "").trim());
        return obj;
      });
    };

    const first = (obj, aliases) => {
      for (const a of aliases) {
        const key = normalizeHeader(a);
        if (obj[key] !== undefined && String(obj[key]).trim() !== "") return obj[key];
      }
      return "";
    };

    const boolValue = (v) => {
      const s = String(v || "").trim().toLowerCase();
      if (["true","yes","y","1","active","enabled"].includes(s)) return true;
      if (["false","no","n","0","inactive","disabled"].includes(s)) return false;
      return null;
    };

    const approvalValue = (v) => {
      const s = String(v || "").trim().toLowerCase();
      if (["approved","approve","yes","true","1"].includes(s)) return true;
      if (["not approved","rejected","denied","pending","no","false","0"].includes(s)) return false;
      return null;
    };

    const dateValue = (v) => {
      if (!v) return null;
      const d = new Date(v);
      return Number.isNaN(d.getTime()) ? null : d;
    };

    const elapsedDays = (later, earlier) => (later - earlier) / 86400000;
    const dayDiff = (later, earlier) => Math.floor(elapsedDays(later, earlier));

    const downloadText = (filename, text) => {
      const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    };


    const frameworkMappings = {
      "AC-03": {
        sox: "Logical Access - termination / deprovisioning",
        soc2: "CC6.2 - user authorization and access removal",
        nist: "PR.AA-05 - access permissions, entitlements, and authorizations",
        iso: "A.5.15 / A.5.16 / A.5.18 - access control, identity management, access rights"
      },
      "AC-05": {
        sox: "Logical Access - privileged-access authorization",
        soc2: "CC6.2 / CC6.3 - authorization, role-based access, privilege changes",
        nist: "PR.AA-05 - access permissions, least privilege, and review",
        iso: "A.5.18 / A.8.2 - access rights and privileged access rights"
      },
      "AC-07": {
        sox: "Logical Access - periodic user-access review",
        soc2: "CC6.2 / CC6.3 - periodic access review and role appropriateness",
        nist: "PR.AA-05 - access permissions are managed and reviewed",
        iso: "A.5.15 / A.5.18 - access control and access-rights review"

      }

    const frameworkForControl = (control) => {
      const value = String(control || "");
      if (value.includes("AC-03")) return frameworkMappings["AC-03"];
      if (value.includes("AC-05")) return frameworkMappings["AC-05"];
      if (value.includes("AC-07")) return frameworkMappings["AC-07"];
      return frameworkMappings["DATA_QUALITY"];

    const sanitizeFilenamePart = (name) => {
      const cleaned = String(name || "")
        .replace(/\.csv$/i, "")
        .normalize("NFKC")
        .replace(/[^\p{L}\p{N}._-]+/gu, "_")
        .replace(/^_+|_+$/g, "");
      return cleaned || "file";

    const csvCell = (value) => {
      const s = String(value ?? "");
      return `"${s.replace(/"/g, '""')}"`;
    };

    function TechnologyRiskAssessmentApp() {
      const [tab, setTab] = React.useState("home");
      const [employeeFile, setEmployeeFile] = React.useState(null);
      const [accessFile, setAccessFile] = React.useState(null);
      const [results, setResults] = React.useState(null);
      const [issues, setIssues] = React.useState([]);
      const [error, setError] = React.useState("");
      const [sourceLabel, setSourceLabel] = React.useState("");
      const [openEvidence, setOpenEvidence] = React.useState(null);
      const employeeInputRef = React.useRef(null);
      const accessInputRef = React.useRef(null);
      const analysisSourceRef = React.useRef(null);
      const [pendingAnchor, setPendingAnchor] = React.useState(null);
      const [activeCaseSection, setActiveCaseSection] = React.useState("case-planning");
      const [criteria, setCriteria] = React.useState({
        deprovisionHours: 24,
        dormantDays: 90,
        recentDays: 30
      });

      const resetAnalysisState = () => {
        setResults(null);
        setIssues([]);
        setSourceLabel("");
        setError("");
        setOpenEvidence(null);
      };

      const updateCriterion = (key, value) => {
        const parsed = Number(value);
        const safeValue = Number.isFinite(parsed) && parsed > 0 ? parsed : 1;
        setCriteria(prev => ({ ...prev, [key]: safeValue }));
        resetAnalysisState();
      };

      const handleEmployeeFileChange = (e) => {
        setEmployeeFile(e.target.files?.[0] || null);
        resetAnalysisState();
      };

      const handleAccessFileChange = (e) => {
        setAccessFile(e.target.files?.[0] || null);
        resetAnalysisState();
      };

      React.useEffect(() => {
        if (tab !== "case" || !pendingAnchor) return;
        const el = document.getElementById(pendingAnchor);
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "start" });
          setPendingAnchor(null);
        }
      }, [tab, pendingAnchor]);

      React.useEffect(() => {
        if (tab !== "case") return;

        const sectionIds = [
          "case-planning",
          "case-risk",
          "case-rcm",
          "case-testing",

const evidenceFiles = {

      const analyzeRows = (employees, access, label) => {
        const appliedCriteria = {
          deprovisionHours: Number(criteria.deprovisionHours) > 0 ? Number(criteria.deprovisionHours) : 24,
          dormantDays: Number(criteria.dormantDays) > 0 ? Number(criteria.dormantDays) : 90,
          recentDays: Number(criteria.recentDays) > 0 ? Number(criteria.recentDays) : 30
        };

        if (!employees.length || !access.length) {
          setError("Both CSV files must contain at least one data row.");
          return;
        }

        const aliases = {
          employeeId: ["employee_id","employeeid","emp_id","id"],
          employeeStatus: ["status","employment_status"],
          terminationDate: ["termination_time","termination_date","terminated_time","terminated_date","end_time","end_date"],
          active: ["active","enabled","account_status","status"],
          lastActive: ["last_active","last_login","last_activity"],
          privileged: ["privileged","admin","is_admin","elevated"],
          role: ["role","access_role","permission"],
          expectedRole: ["expected_role","expected_access_role"],
          approvalStatus: ["approval_status","approved"],
          approvalDate: ["approval_time","approval_date","approved_at"],
          provisionedDate: ["provisioned_time","provisioning_time","provisioned_date","granted_time","granted_date","created_at"],
          deactivationDate: ["deactivation_time","deactivation_date","disabled_time","disabled_date","deactivated_at","disabled_at"],
          modifiedDate: ["modified_date","updated_at","last_modified"]
        };

        const employeeColumns = new Set(Object.keys(employees[0] || {}));
        const accessColumns = new Set(Object.keys(access[0] || {}));
        const employeeHasAny = (names) => names.some(n => employeeColumns.has(normalizeHeader(n)));
        const accessHasAny = (names) => names.some(n => accessColumns.has(normalizeHeader(n)));

        if (!employeeHasAny(aliases.employeeId)) {
          setError("Employee roster must contain an employee_id column (aliases such as emp_id are also accepted).");
          return;
        }
        if (!accessHasAny(aliases.employeeId)) {
          setError("System access export must contain an employee_id column so accounts can be reconciled to the employee roster.");
          return;

        const coverage = {
          terminated: employeeHasAny(aliases.employeeStatus) && accessHasAny(aliases.active),
          orphaned: accessHasAny(aliases.active),
          lateDeprovision:
            employeeHasAny(aliases.employeeStatus) &&
            employeeHasAny(aliases.terminationDate) &&
            accessHasAny(aliases.deactivationDate),
          dormant: accessHasAny(aliases.active) && accessHasAny(aliases.lastActive),
          privileged:

            accessHasAny(aliases.provisionedDate) &&

          roleMismatch: accessHasAny(aliases.role) && accessHasAny(aliases.expectedRole),

        const employeeMap = new Map();
        const duplicateEmployeeIds = new Set();

        employees.forEach(emp => {

          if (!id) return;

          if (employeeMap.has(normalizedId)) {
            duplicateEmployeeIds.add(String(id).trim());

            employeeMap.set(normalizedId, emp);

          setResults(null);
          setIssues([]);
          setSourceLabel("");

            "Resolve duplicates before analysis so the authoritative roster is unambiguous."

          return;
        }

        const detectedIssues = [];
        const terminatedEmployees = new Set();
        let orphaned = 0;
        let privileged = 0;
        let dormant = 0;
        let roleMismatch = 0;
        let changes = 0;
        let lateDeprovision = 0;
        const now = new Date();

        const addDataQualityIssue = ({ employee, account, system, detail, control, severity = "Medium" }) => {
          detectedIssues.push({
            type: "Insufficient evidence / data quality",
            severity,
            employee: employee || "Unmatched",
            account,
            system,
            detail,
            control
          });
        };

        access.forEach((acct, idx) => {
          const empId = first(acct, aliases.employeeId);
          const accountId = first(acct, ["account_id","account","username","user","email"]) || `Row ${idx + 2}`;
          const system = first(acct, ["system","application","app"]) || "Unknown system";
          const role = first(acct, aliases.role);
          const expectedRole = first(acct, aliases.expectedRole);
          const active = accessHasAny(aliases.active) ? boolValue(first(acct, aliases.active)) : null;
          const lastActive = accessHasAny(aliases.lastActive) ? dateValue(first(acct, aliases.lastActive)) : null;
          const modified = accessHasAny(aliases.modifiedDate) ? dateValue(first(acct, aliases.modifiedDate)) : null;
          const deactivationDate = accessHasAny(aliases.deactivationDate) ? dateValue(first(acct, aliases.deactivationDate)) : null;

          const privilegedRaw = first(acct, aliases.privileged);
          const isPrivileged =
            (accessHasAny(aliases.privileged) || accessHasAny(aliases.role))
              ? (boolValue(privilegedRaw) === true || /admin|owner|root|superuser/i.test(role || ""))
              : null;

          const approvalRaw = first(acct, aliases.approvalStatus);
          const approvalStatus = accessHasAny(aliases.approvalStatus) ? approvalValue(approvalRaw) : null;
          const approvalDate = accessHasAny(aliases.approvalDate) ? dateValue(first(acct, aliases.approvalDate)) : null;
          const provisionedDate = accessHasAny(aliases.provisionedDate) ? dateValue(first(acct, aliases.provisionedDate)) : null;

          const emp = employeeMap.get(String(empId || "").toLowerCase());
          const empStatus = emp && employeeHasAny(aliases.employeeStatus) ? first(emp, aliases.employeeStatus) : "";
          const terminationDate = emp && employeeHasAny(aliases.terminationDate) ? dateValue(first(emp, aliases.terminationDate)) : null;
          const terminatedStatus = employeeHasAny(aliases.employeeStatus)
            ? /terminated|inactive|former|left|separated/i.test(empStatus)
            : false;

          // Row-level evidence quality: do not silently treat missing/invalid values as a pass.
          if (accessHasAny(aliases.active) && active === null) {
            addDataQualityIssue({
              employee: empId || "No employee ID",
              account: accountId,
              system,
              detail: "Account active-status value is missing or invalid, so status-dependent access tests cannot be evaluated for this record.",
              control: "Input data quality"
            });
          }

          if (coverage.dormant && active === true && !lastActive) {
            addDataQualityIssue({
              employee: empId || "Unmatched",
              account: accountId,
              system,
              detail: "last_active is missing or invalid for an active account, so dormancy cannot be evaluated for this record.",
              control: "AC-07"
            });
          }

          if (emp && terminatedStatus && employeeHasAny(aliases.terminationDate) && !terminationDate) {
            addDataQualityIssue({
              employee: empId,
              account: accountId,
              system,
              detail: "Termination timestamp is missing or invalid for an employee marked terminated, so AC-03 timing cannot be evaluated.",
              control: "AC-03",
              severity: "High"
            });
          }

          if (
            coverage.lateDeprovision &&
            emp &&
            terminatedStatus &&
            terminationDate &&
            active === false &&
            !deactivationDate
          ) {
            addDataQualityIssue({
              employee: empId,
              account: accountId,
              system,
              detail: `Account is inactive but the deactivation timestamp is missing or invalid, so ${appliedCriteria.deprovisionHours}-hour deprovisioning timeliness cannot be evaluated.`,
              control: "AC-03",
              severity: "High"
            });
          }

          if (coverage.roleMismatch && role && !expectedRole) {
            addDataQualityIssue({
              employee: empId || "Unmatched",
              account: accountId,
              system,
              detail: "expected_role is missing for this access record, so role appropriateness cannot be evaluated.",
              control: "AC-07"
            });
          }

          if (
            accessHasAny(aliases.privileged) &&
            String(privilegedRaw || "").trim() !== "" &&
            boolValue(privilegedRaw) === null
          ) {
            addDataQualityIssue({
              employee: empId || "Unmatched",
              account: accountId,
              system,
              detail: "Privileged-access indicator is invalid, so privileged-access scope cannot be determined reliably for this record.",
              control: "AC-05"
            });
          }

          // Unmatched account: only evaluate when active-status data exists.
          if (coverage.orphaned && active === true && (!empId || !emp)) {
            orphaned++;
            detectedIssues.push({
              type: "Unmatched active account",
              severity: "High",
              employee: empId || "No employee ID",
              account: accountId,
              system,
              detail: "Active account cannot be matched to the employee roster. It may represent a service, contractor, shared, or unauthorized account and requires review.",
              control: "AC-07 / account reconciliation"
            });
          }

          // Terminated employee still has an active account.
          // If a termination timestamp column is available, the effective time must have occurred.
          const terminationIsEffective =
            !employeeHasAny(aliases.terminationDate) ||
            (terminationDate && terminationDate.getTime() <= now.getTime());

          if (coverage.terminated && emp && terminatedStatus && terminationIsEffective && active === true) {
            terminatedEmployees.add(String(empId).toLowerCase());
            detectedIssues.push({
              type: "Terminated user with access",
              severity: "High",
              employee: empId,
              account: accountId,
              system,
              detail: terminationDate
                ? `Account remains active after effective termination date ${terminationDate.toISOString().slice(0,10)}.`
                : "Account remains active for an employee marked terminated.",
              control: "AC-03"
            });
          }

          // Deprovisioning timeliness: distinguish a late closure from an account still active.
          if (coverage.lateDeprovision && emp && terminatedStatus && terminationDate && deactivationDate) {
            const hours = (deactivationDate.getTime() - terminationDate.getTime()) / 3600000;
            if (hours > appliedCriteria.deprovisionHours) {
              lateDeprovision++;
              detectedIssues.push({
                type: "Late deprovisioning",
                severity: "High",
                employee: empId,
                account: accountId,
                system,
                detail: `Access was disabled ${hours.toFixed(1)} hours after the effective termination time (review threshold: ${appliedCriteria.deprovisionHours} hours).`,
                control: "AC-03"
              });
            }
          }

          if (coverage.dormant && active === true && lastActive && elapsedDays(now, lastActive) > appliedCriteria.dormantDays) {
            dormant++;
            detectedIssues.push({
              type: "Dormant active account",
              severity: isPrivileged === true ? "High" : "Medium",
              employee: empId || "Unmatched",
              account: accountId,
              system,
              detail: `No recorded activity for ${dayDiff(now, lastActive)} days.`,
              control: "AC-07"
            });
          }

          if (coverage.privileged && isPrivileged === true) {
            const approvalStatusPresent = String(approvalRaw || "").trim() !== "";
            const approvalStatusBad = approvalStatusPresent && approvalStatus !== true;
            const approvalDateMissing = !approvalDate;
            const provisionedDateMissing = !provisionedDate;
            const approvalAfterProvision = approvalDate && provisionedDate && approvalDate > provisionedDate;

            if (approvalStatusBad || approvalDateMissing || provisionedDateMissing || approvalAfterProvision) {
              privileged++;
              let reason = "Privileged access does not have complete pre-provisioning approval evidence.";

              if (approvalDateMissing && provisionedDateMissing) {
                reason = "Approval and provisioning timestamps are missing or invalid, so pre-provisioning approval cannot be evaluated.";
              } else if (approvalDateMissing) {
                reason = "Approval timestamp is missing or invalid, so pre-provisioning approval cannot be demonstrated.";
              } else if (provisionedDateMissing) {
                reason = "Provisioning timestamp is missing or invalid, so pre-provisioning approval cannot be evaluated.";
              } else if (approvalAfterProvision) {
                reason = "Approval timestamp is later than the provisioning timestamp.";
              } else if (approvalStatusBad) {
                reason = `Approval status "${approvalRaw}" is not an approved value.`;
              }

              detectedIssues.push({
                type: "Privileged access anomaly",
                severity: "High",
                employee: empId || "Unmatched",
                account: accountId,
                system,
                detail: reason,
                control: "AC-05"
              });
            }
          }

          if (coverage.roleMismatch && expectedRole && role && expectedRole.toLowerCase() !== role.toLowerCase()) {
            roleMismatch++;
            detectedIssues.push({
              type: "Role mismatch",
              severity: isPrivileged === true ? "High" : "Medium",
              employee: empId || "Unmatched",
              account: accountId,
              system,
              detail: `Assigned role "${role}" differs from expected role "${expectedRole}".`,
              control: "AC-07"
            });
          }

          if (
            coverage.changes &&
            modified &&
            elapsedDays(now, modified) >= 0 &&
            elapsedDays(now, modified) <= appliedCriteria.recentDays
          ) {
            changes++;
          }
        });

        setSourceLabel(label);
        setResults({
          terminated: coverage.terminated ? terminatedEmployees.size : null,

          privileged: coverage.privileged ? privileged : null,
          dormant: coverage.dormant ? dormant : null,
          roleMismatch: coverage.roleMismatch ? roleMismatch : null,
          changes: coverage.changes ? changes : null,
          coverage,
          criteria: appliedCriteria,
          employees: employees.length,
          accounts: access.length
        });
        setIssues(detectedIssues);

      const getAnalysisSummary = () => {
        if (!results) return null;

        const dataQualityIssues = issues.filter(
          x => x.type === "Insufficient evidence / data quality"
        );
        const confirmedIssues = issues.filter(
          x => x.type !== "Insufficient evidence / data quality"
        );

        const affectedAccountKeys = new Set(

            const employee = String(issue.employee || "").trim();
            const account = String(issue.account || "").trim();
            const system = String(issue.system || "").trim();
            return `${employee}|${account}|${system}`;
          })
        );
        const affectedAccounts = affectedAccountKeys.size;

        const countForControl = (controlId, list = confirmedIssues) =>
          list.filter(x => String(x.control || "").includes(controlId)).length;

        const ac03Confirmed = countForControl("AC-03");
        const ac03DQ = countForControl("AC-03", dataQualityIssues);

        const ac05Confirmed = countForControl("AC-05");
        const ac05DQ = countForControl("AC-05", dataQualityIssues);

        const ac07Confirmed = countForControl("AC-07");
        const ac07DQ = countForControl("AC-07", dataQualityIssues);

        const ac03CoverageTests = [
          results.coverage.terminated,
          results.coverage.lateDeprovision
        ];
        const ac03Available = ac03CoverageTests.filter(Boolean).length;
        const ac05Coverage = results.coverage.privileged;

        const ac07CoverageTests = [
          results.coverage.orphaned,
          results.coverage.dormant,
          results.coverage.roleMismatch
        ];
        const ac07Available = ac07CoverageTests.filter(Boolean).length;

        const totalRuleGroups =
          ac03CoverageTests.length + 1 + ac07CoverageTests.length;
        const availableRuleGroups =
          ac03Available + (ac05Coverage ? 1 : 0) + ac07Available;
        const fullCoverage = availableRuleGroups === totalRuleGroups;

        const controlStatus = ({ available, full = true, confirmed, dq }) => {
          if (!available) return "Not evaluated";
          if (confirmed > 0 && dq > 0) return "Exceptions + evidence gaps";
          if (confirmed > 0) return "Exceptions identified";
          if (dq > 0) return "Insufficient evidence";
          if (!full) return "Partially evaluated - no exceptions detected";
          return "No exceptions detected";
        };

        const ac03Status = controlStatus({
          available: ac03Available > 0,
          full: ac03Available === ac03CoverageTests.length,
          confirmed: ac03Confirmed,
          dq: ac03DQ
        });

        const ac05Status = controlStatus({
          available: ac05Coverage,
          full: ac05Coverage,
          confirmed: ac05Confirmed,
          dq: ac05DQ
        });

        const ac07Status = controlStatus({
          available: ac07Available > 0,
          full: ac07Available === ac07CoverageTests.length,
          confirmed: ac07Confirmed,
          dq: ac07DQ
        });

        let overallStatus;
        let overallDetail;
        const coverageNote =
          fullCoverage
            ? ""
            : ` Only ${availableRuleGroups} of ${totalRuleGroups} automated rule groups were evaluable from the available columns.`;

        if (confirmedIssues.length > 0) {
          overallStatus = "Review required";
          overallDetail =
            `${confirmedIssues.length} confirmed exception instance(s) across ${affectedAccounts} affected account(s) were identified. ` +
            (dataQualityIssues.length > 0
              ? `${dataQualityIssues.length} additional record(s) contain insufficient or invalid evidence and require follow-up.`
              : "No additional evidence-quality issues were identified.") +
            coverageNote;
        } else if (dataQualityIssues.length > 0) {
          overallStatus = "Evidence gaps require review";
          overallDetail =
            `No confirmed control exception rows were identified, but ${dataQualityIssues.length} record(s) could not be fully evaluated because required evidence was missing or invalid.` +
            coverageNote;
        } else if (availableRuleGroups === 0) {
          overallStatus = "Not evaluated";
          overallDetail =
            "The uploaded files contain the core employee_id fields, but the additional columns required for the automated access-control tests are not available. N/A metrics must not be interpreted as control passes.";
        } else if (!fullCoverage) {
          overallStatus = "Partial evaluation - no exceptions detected";
          overallDetail =
            `No confirmed exceptions or evidence-quality issues were identified in the ${availableRuleGroups} of ${totalRuleGroups} automated rule groups that could be evaluated. Unevaluated rule groups must not be interpreted as control passes.`;
        } else {
          overallStatus = "No exceptions detected";
          overallDetail =
            "No confirmed exceptions or evidence-quality issues were identified by the available automated tests.";
        }

        return {
          confirmedIssues,
          dataQualityIssues,
          affectedAccounts,
          overallStatus,
          overallDetail,
          controls: [
            {
              id: "AC-03",
              name: "Termination Access Removal",
              coverage:
                ac03Available === 0
                  ? "Not evaluated"
                  : ac03Available === ac03CoverageTests.length
                    ? "Evaluated"
                    : `Partially evaluated (${ac03Available}/${ac03CoverageTests.length} rule groups)`,
              status: ac03Status,
              confirmed: ac03Confirmed,
              dq: ac03DQ,
              basis: `Terminated-user access and deprovisioning > ${results.criteria?.deprovisionHours || 24} hours`
            },
            {
              id: "AC-05",
              name: "Privileged Access Pre-Approval",
              coverage: ac05Coverage ? "Evaluated" : "Not evaluated",
              status: ac05Status,
              confirmed: ac05Confirmed,
              dq: ac05DQ,
              basis: `Privileged-access approval and provisioning-timestamp tests`
            },
            {
              id: "AC-07",
              name: "Access Review / Reconciliation",
              coverage:
                ac07Available === 0
                  ? "Not evaluated"
                  : ac07Available === ac07CoverageTests.length
                    ? "Evaluated"
                    : `Partially evaluated (${ac07Available}/${ac07CoverageTests.length} rule groups)`,
              status: ac07Status,
              confirmed: ac07Confirmed,
              dq: ac07DQ,
              basis: `Unmatched-account, dormancy > ${results.criteria?.dormantDays || 90} days, and role-alignment tests`
            }
          ]
        };
      };


      const downloadExceptionsCSV = () => {
        if (!results) {

        const headers = [
          "issue",
          "severity",
          "employee",
          "account",

          "detail",
          "related_control",
          "sox_itgc",
          "soc_2_tsc",
          "nist_csf_2_0",
          "iso_27001_2022"
        ];

        const rows = issues.map(issue => {
          const mapping = frameworkForControl(issue.control);
          return [
            issue.type,
            issue.severity,
            issue.employee,
            issue.account,
            issue.system,
            issue.detail,
            issue.control,
            mapping.sox,
            mapping.soc2,
            mapping.nist,
            mapping.iso
          ];
        });

        const csv = [headers, ...rows]

                </div>

                <div className="field"><div className="label">Population Completeness</div><div className="value">Obtained the HR termination report directly from the authoritative HR system and reconciled the total of 127 terminated employees to monthly HR termination summaries.</div></div>
                <div className="field"><div className="label">Population Accuracy</div><div className="value">Selected 5 records and agreed employee ID, employee name, department, and effective termination date to underlying HR records. No discrepancies noted.</div></div>
                <div className="field"><div className="label">Testing Approach</div><div className="value">Full-population reconciliation. Each of the 127 terminated employees was matched to all associated accounts in each in-scope system. Each account was independently evaluated for deactivation timing and post-termination activity.</div></div>
                <div className="field"><div className="label">Attributes</div>
                  <table><thead><tr><th>Attribute</th><th>Test</th></tr></thead><tbody>
                    <tr><td>A</td><td>Employee appears in authoritative termination population</td></tr>
                    <tr><td>B</td><td>All associated in-scope accounts identified</td></tr>
                    <tr><td>C</td><td>Account deactivated</td></tr>
                    <tr><td>D</td><td>Deactivation occurred within 24 hours of effective termination time</td></tr>
                    <tr><td>E</td><td>No login or activity occurred after effective termination time</td></tr>
                  </tbody></table>
                </div>
                <div className="field"><div className="label">Representative Results</div>
                  <table><thead><tr><th>ID</th><th>System</th><th>Elapsed</th><th>D</th><th>E</th><th>Result</th></tr></thead><tbody>
                    <tr><td>EMP-014</td><td>GitHub</td><td>2 hrs</td><td>Pass</td><td>Pass</td><td>Pass</td></tr>
                    <tr><td>EMP-029</td><td>Google Workspace</td><td>72 hrs</td><td>Fail</td><td>Pass</td><td>Exception</td></tr>
                    <tr><td>EMP-088</td><td>AWS</td><td>96 hrs</td><td>Fail</td><td>Pass</td><td>Exception</td></tr>
                    <tr><td>EMP-142</td><td>GitHub</td><td>Still active at 10 days</td><td>Fail</td><td>Pass</td><td>Exception</td></tr>
                  </tbody></table>
                </div>
                <div className="field"><div className="label">Result</div><div className="value">3 employee-level exceptions were identified among 127 terminated employees. EMP-142 is classified as a terminated-user account remaining active, not as an unmatched active account.</div></div>
                <div className="field"><div className="label">Conclusion</div><div className="value"><strong style={{color:"#f85149"}}>Not operating effectively.</strong> The control did not consistently achieve timely deprovisioning during the period tested.</div></div>
              </div>

              <div className="wp" id="wp-ac02">
                <div className="wp-head"><strong>Privileged Access Approval Testing</strong><span className="ref">WP-AC-02</span></div>
                <div className="meta-grid">
                  <div className="meta-item"><div className="k">Control Description</div><div className="v">Direct manager approval must be documented before privileged access is provisioned.</div></div>
                  <div className="meta-item"><div className="k">Test Objective</div><div className="v">Determine whether selected privileged-access grants were supported by timely documented approval.</div></div>
                  <div className="meta-item"><div className="k">Audit Period</div><div className="v">January 1 - June 30, 2025</div></div>
                  <div className="meta-item"><div className="k">Testing Date</div><div className="v">July 12, 2025</div></div>
                  <div className="meta-item"><div className="k">Evidence Obtained</div><div className="v">Privileged-access request population, approval evidence, request timestamps, and provisioning timestamps.</div></div>
                  <div className="meta-item"><div className="k">Procedure</div><div className="v">Validate population reliability, select risk-based items, inspect approval evidence, compare approval to provisioning timestamps, and document exceptions.</div></div>
                </div>

                <div className="field"><div className="label">Control ID</div><div className="value">AC-05</div></div>
                <div className="field"><div className="label">Population</div><div className="value">34 privileged-access grants during January 1 - June 30, 2025.</div></div>
                <div className="field">
                  <div className="label">Representative Synthetic Evidence Excerpt</div>
                  <div className="value">
                    <button className="action-link" onClick={() => setOpenEvidence("Privileged_Access_Requests.csv")}>View Privileged_Access_Requests.csv excerpt</button>
                    {openEvidence === "Privileged_Access_Requests.csv" && evidenceViewer("Privileged_Access_Requests.csv")}
                    <div style={{marginTop:"8px", fontSize:"11px", color:"#6e7681"}}>Excerpt only. The workpaper population and sample sizes represent the simulated full population used for the case study.</div>
                  </div>
                </div>

                <div className="field"><div className="label">Population Completeness</div><div className="value">Obtained the privileged-access grant population from the access-request system for the audit period and reconciled the total count of 34 requests to monthly privileged-access activity summaries.</div></div>
                <div className="field"><div className="label">Population Accuracy</div><div className="value">Selected 3 records and agreed request ID, user, requested role, manager approval timestamp, and provisioning timestamp to the underlying request documentation. No discrepancies noted.</div></div>
                <div className="field"><div className="label">Sampling Approach</div><div className="value">Non-statistical, risk-based selection of 15 items for this simulated engagement. Selections were distributed across the six-month audit period and included all highest-risk administrative roles. The sample size is illustrative and does not represent a firm-specific audit sampling methodology.</div></div>
                <div className="field"><div className="label">Attributes</div>
                  <table><thead><tr><th>Attribute</th><th>Test</th></tr></thead><tbody>
                    <tr><td>A</td><td>Access request exists</td></tr>
                    <tr><td>B</td><td>Manager approval is documented</td></tr>
                    <tr><td>C</td><td>Approval predates provisioning</td></tr>
                    <tr><td>D</td><td>Approval evidence is retained</td></tr>
                  </tbody></table>
                </div>
                <div className="field"><div className="label">Result</div><div className="value">2 of 15 selections (13.3%) were exceptions. One approval was documented two days after provisioning. One request lacked documented approval before provisioning and received verbal approval three days later.</div></div>
                <div className="field"><div className="label">Conclusion</div><div className="value"><strong style={{color:"#f85149"}}>Not operating effectively.</strong> The control did not consistently enforce pre-provisioning approval.</div></div>
              </div>

              <div className="wp" id="wp-ac03">
                <div className="wp-head"><strong>Quarterly User Access Review Testing</strong><span className="ref">WP-AC-03</span></div>
                <div className="meta-grid">
                  <div className="meta-item"><div className="k">Control Description</div><div className="v">System owners review complete user-access listings quarterly and track identified removals to completion.</div></div>
                  <div className="meta-item"><div className="k">Test Objective</div><div className="v">Determine whether quarterly access reviews were complete, appropriately performed, evidenced, and remediated timely.</div></div>
                  <div className="meta-item"><div className="k">Audit Period</div><div className="v">Q1 and Q2 2025</div></div>
                  <div className="meta-item"><div className="k">Testing Date</div><div className="v">July 15, 2025</div></div>
                  <div className="meta-item"><div className="k">Evidence Obtained</div><div className="v">System-user review listings, reviewer sign-off, identified removal logs, and remediation tracking records.</div></div>
                  <div className="meta-item"><div className="k">Procedure</div><div className="v">Validate report reliability, inspect reviewer appropriateness, confirm privileged-access consideration, and verify identified removals were tracked to completion.</div></div>
                </div>

                <div className="field"><div className="label">Control ID</div><div className="value">AC-07</div></div>
                <div className="field"><div className="label">Population</div><div className="value">6 quarterly access-review events: Q1 and Q2 reviews for GitHub, Google Workspace, and AWS.</div></div>
                <div className="field">
                  <div className="label">Representative Synthetic Evidence Excerpt</div>
                  <div className="value">
                    <button className="action-link" onClick={() => setOpenEvidence("Quarterly_Access_Review.csv")}>View Quarterly_Access_Review.csv excerpt</button>
                    {openEvidence === "Quarterly_Access_Review.csv" && evidenceViewer("Quarterly_Access_Review.csv")}
                    <div style={{marginTop:"8px", fontSize:"11px", color:"#6e7681"}}>Representative excerpt of the six simulated review events described in this workpaper.</div>
                  </div>
                </div>

                <div className="field"><div className="label">Report Reliability / Completeness</div><div className="value">For each system, validated that the review listing was generated from the system of record using the active-user population parameters applicable to the review date. Reconciled report record counts to independently generated system-user summaries and inspected selected users to underlying account records.</div></div>
                <div className="field"><div className="label">Report Accuracy</div><div className="value">For selected users across each system, agreed user identity, status, assigned role, and privileged-access indicator from the review listing to the underlying system account record. No discrepancies noted.</div></div>
                <div className="field"><div className="label">Testing Approach</div><div className="value">Full-population testing of all six review events because the control-event population was small and discrete.</div></div>
                <div className="field"><div className="label">Attributes</div>
                  <table><thead><tr><th>Attribute</th><th>Test</th></tr></thead><tbody>
                    <tr><td>A</td><td>Review used a complete and reliable system-user population</td></tr>
                    <tr><td>B</td><td>Appropriate system owner performed and evidenced the review</td></tr>
                    <tr><td>C</td><td>Privileged access was specifically considered</td></tr>
                    <tr><td>D</td><td>Reviewer decisions and identified removals were documented</td></tr>
                    <tr><td>E</td><td>Identified removals were tracked to completion within the defined remediation period</td></tr>
                  </tbody></table>
                </div>
                <div className="field"><div className="label">Results</div><div className="value">All 6 reviews were completed by the appropriate system owner using complete and reliable user listings. Across the six reviews, 11 access-removal items were identified and all 11 were completed within the required 10-business-day remediation window.</div></div>
                <div className="field"><div className="label">Conclusion</div><div className="value"><strong style={{color:"#3fb950"}}>Operating effectively.</strong> No exceptions were identified in the six review events tested.</div></div>
              </div>
            </section>

            <section className="case-section" id="case-findings">
              <h3>8. Audit Findings</h3>

              <div className="finding" id="finding-01">
                <h4>FINDING #1 - Delayed Termination Access Removal</h4>
                <div className="field"><div className="label">Risk Rating</div><div className="value"><span className="badge high">High</span></div></div>
                <div className="field"><div className="label">Condition</div><div className="value">3 of 127 terminated employees retained at least one in-scope account beyond the required 24-hour deprovisioning threshold. The longest resolved delay was 96 hours; one account remained active as of the testing date.</div></div>
                <div className="field"><div className="label">Criteria</div><div className="value">Company Access Control Standard v2.1, effective January 1, 2025, requires all in-scope access to be disabled within 24 hours of the employee's effective termination time.</div></div>
                <div className="field"><div className="label">Cause</div><div className="value">The process relies on manual email communication from HR to IAM and lacks an independent completeness control to identify missed or delayed termination events.</div></div>
                <div className="field"><div className="label">Risk</div><div className="value">Former employees may retain unauthorized access to company systems and sensitive information.</div></div>
                <div className="field"><div className="label">Audit Recommendation</div><div className="value">Management should establish a formal mechanism that ensures termination events are completely and timely communicated to IAM and independently verifies that terminated users are removed from all in-scope systems within the required timeframe.</div></div>
                <div className="field"><div className="label">Potential Remediation Approaches</div><div className="value">HR-to-IAM integration, daily reconciliation of active accounts to the authoritative employee population, and monitored exception alerts are possible management responses.</div></div>
                <div className="field"><div className="label">Simulated Management Response</div><div className="value">Accepted. HR and IT committed to implementing automated termination-event transmission and a daily reconciliation control by September 30, 2025.</div></div>
              </div>

              <div className="finding" id="finding-02">
                <h4>FINDING #2 - Privileged Access Pre-Approval Not Enforced</h4>
                <div className="field"><div className="label">Risk Rating</div><div className="value"><span className="badge medium">Medium</span></div></div>
                <div className="field"><div className="label">Condition</div><div className="value">2 of 15 privileged-access grants tested (13.3%) were provisioned before documented manager approval was obtained.</div></div>
                <div className="field"><div className="label">Criteria</div><div className="value">Company policy requires documented direct-manager approval before privileged access is provisioned.</div></div>
                <div className="field"><div className="label">Cause</div><div className="value">Approval is performed outside the provisioning workflow, so no technical control prevents provisioning before approval.</div></div>
                <div className="field"><div className="label">Risk</div><div className="value">Privileged access may be granted without appropriate authorization, increasing the risk of unauthorized changes or sensitive-data access.</div></div>
                <div className="field"><div className="label">Audit Recommendation</div><div className="value">Management should implement a workflow control that prevents privileged access from being provisioned until required approval is documented.</div></div>
                <div className="field"><div className="label">Simulated Management Response</div><div className="value">Accepted. IT committed to implementing workflow-based approval gating by September 30, 2025.</div></div>
              </div>
            </section>

            <section className="case-section" id="case-remediation">
              <h3>9. Remediation & Retesting</h3>

              <div className="wp">
                <div className="wp-head"><strong>Finding #1 Retest</strong><span className="ref">WP-AC-01-RT</span></div>
                <div className="field"><div className="label">Implementation</div><div className="value">September 15, 2025: automated termination-event transmission and daily active-user reconciliation implemented.</div></div>
                <div className="field"><div className="label">Retest</div><div className="value">38 termination events from September 15 - October 15, 2025; full-population testing.</div></div>
                <div className="field"><div className="label">Result</div><div className="value">0 of 38 exceptions. Average deprovisioning time: 1.8 hours.</div></div>
                <div className="field"><div className="label">Conclusion</div><div className="value"><span className="badge effective">Remediated</span> The revised control operated effectively for the retest period.</div></div>
              </div>

              <div className="wp">
                <div className="wp-head"><strong>Finding #2 Retest</strong><span className="ref">WP-AC-02-RT</span></div>
                <div className="field"><div className="label">Implementation</div><div className="value">September 30, 2025: service-management workflow configured to gate privileged provisioning on documented manager approval.</div></div>
                <div className="field"><div className="label">Retest</div><div className="value">10 post-implementation privileged-access grants selected judgmentally.</div></div>
                <div className="field"><div className="label">Result</div><div className="value">0 of 10 exceptions. All approval timestamps preceded provisioning timestamps.</div></div>
                <div className="field"><div className="label">Conclusion</div><div className="value"><span className="badge effective">Remediated</span> The revised control operated effectively for the retest selections.</div></div>
              </div>
            </section>

            <section className="case-section" id="case-conclusion">
              <h3>10. Engagement Conclusion</h3>
              <p>
                For the three logical-access controls included in this simulated engagement, AC-03 and AC-05 contained
                design deficiencies and did not operate effectively during the January 1 - June 30, 2025 audit period.
                AC-07 was appropriately designed and operated effectively for all six quarterly review events tested.
              </p>
              <p style={{marginTop:"14px"}}>
                Two findings were issued: one High and one Medium. Simulated remediation for AC-03 and AC-05 was retested
                in October 2025 and no exceptions were identified in the defined retest populations/selections.
              </p>
              <p style={{marginTop:"14px"}}>
                <strong style={{color:"#c9d1d9"}}>Scope limitation:</strong> This conclusion is limited to the controls and periods tested
                and is not an opinion on the hypothetical organization's entire logical-access environment.
              </p>
            </section>
              </article>
            </div>
          </div>
        </main>
      );


      return <>
        <header>
          <div className="container">
            <div className="brand-block">
              <div className="brand-copy">
                <p>Technology Risk, Controls & Access Review</p>
              </div>
            </div>
            <nav>
              <button className={tab==="home" ? "active" : ""} onClick={() => setTab("home")}>Overview</button>
              <button className={tab==="tool" ? "active" : ""} onClick={() => setTab("tool")}>Access Review</button>
              <button className={tab==="case" ? "active" : ""} onClick={() => setTab("case")}>Audit Case Study</button>
            </nav>
          </div>
        </header>
        <div className="portfolio-note">
          <div className="container"><strong>Portfolio project.</strong> The Audit Case Study uses synthetic data. Files selected in the Access Analysis Tool are processed locally in your browser and are not uploaded to a server.</div>
        </div>

        {tab==="home" && <Home />}
        {tab==="tool" && <Tool />}
        {tab==="case" && <CaseStudy />}

        <footer>
          <div className="container">Simulated technology risk and IT audit portfolio project</div>
        </footer>
      </>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<TechnologyRiskAssessmentApp />);
  </script>
</body>
</html>
